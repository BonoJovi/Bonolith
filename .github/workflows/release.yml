name: Release

# Build the IBus engine binary and publish a GitHub Release whenever a
# version tag (vX.Y.Z) is pushed. The built-in dictionary is compiled
# into the binary, so the published artifact is a self-contained IBus
# engine — no IPADIC, no dictionary generation, no Rust toolchain needed
# on the user's machine. The Fcitx5 addon is intentionally not shipped
# here: it links against the user's installed Fcitx5 and must be built
# from source (see README).

on:
  push:
    tags:
      # Match semver vX.Y.Z only (plus optional pre-release suffix like -rc1),
      # so ad-hoc tags starting with 'v' don't trigger a public release.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  build-release:
    # Pinned to the oldest supported runner so the binary links against
    # an older glibc and remains loadable on Ubuntu 22.04 / Debian 12
    # users. Bumping this raises the minimum glibc floor for all users.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        # dtolnay/rust-toolchain uses branch names (`stable`) rather than
        # semver tags. Pinned to the current `stable` HEAD commit; bump
        # manually when adopting a newer Rust — Dependabot does not track
        # SHA pins that originate from branch refs.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches Cargo.toml and bonolith.xml
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXPECT="${TAG#v}"
          CARGO_VER=$(grep -E '^version = "[^"]+"' Cargo.toml | head -1 | sed -E 's/version = "(.+)"/\1/')
          XML_VER=$(grep -oE '<version>[^<]+</version>' data/bonolith.xml | sed -E 's|<version>(.+)</version>|\1|')
          if [ "$CARGO_VER" != "$EXPECT" ]; then
            echo "::error::Cargo.toml version '$CARGO_VER' does not match tag '$TAG'"
            exit 1
          fi
          if [ "$XML_VER" != "$EXPECT" ]; then
            echo "::error::data/bonolith.xml version '$XML_VER' does not match tag '$TAG'"
            exit 1
          fi

      - name: Run tests
        run: cargo test --release --locked

      - name: Build release binary
        run: cargo build --release --locked --bin bonolith

      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="bonolith-${VERSION}-x86_64-linux"
          mkdir -p "$STAGE"
          cp target/release/bonolith "$STAGE/"
          cp data/bonolith.xml "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: |
            ## Bonolith ${{ github.ref_name }}

            **IBus users — no build required.** The attached
            `bonolith-*-x86_64-linux.tar.gz` contains a prebuilt engine
            binary with the dictionary compiled in:

            ```bash
            tar xzf bonolith-*-x86_64-linux.tar.gz
            cd bonolith-*-x86_64-linux
            sudo cp bonolith /usr/bin/ibus-engine-bonolith
            sudo cp bonolith.xml /usr/share/ibus/component/bonolith.xml
            ibus-daemon -drx
            ```

            **Fcitx5 users** still build the addon from source — see the
            README. **LLM reranking** is optional; set it up per the
            README if you want it.

            ---
          files: |
            bonolith-*-x86_64-linux.tar.gz
            bonolith-*-x86_64-linux.tar.gz.sha256

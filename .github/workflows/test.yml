name: Test

# Run cargo test on every push to and PR against main/dev so regressions
# surface before release-tag time. Complements CodeQL (static analysis)
# and release.yml (tag-triggered build+test+publish).
#
# Devin PR #3 #4 flagged the gap that reviewers had no CI test evidence
# to point at for author-only "all tests pass" claims — this workflow
# closes that gap by publishing a check every reviewer can inspect.

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    # ubuntu-latest is fine for tests (no glibc floor to preserve —
    # release.yml pins ubuntu-22.04 only for the shipped binary).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        # Same pin as release.yml so the toolchain floor stays uniform.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo test --release --locked
        # --locked guards against silent Cargo.lock drift — matches the
        # release build. Release profile matches production and, at ~7s
        # runtime for our suite, is still fast net of compile.
        # The live-LLM integration tests are #[ignore]'d, so no
        # llama-server is needed here.
        run: cargo test --release --locked

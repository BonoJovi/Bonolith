# CodeRabbit configuration for Bonolith.
# https://docs.coderabbit.ai/reference/configuration
#
# Bonolith is a Japanese IME (IBus + Fcitx5) with a Rust core, a C++
# Fcitx5 addon, and a Python word-register dialog. This config tunes
# CodeRabbit to review the parts that actually change and to enforce
# the project-specific rules from CLAUDE.md.

language: "ja-JP"
early_access: false
enable_free_tier: true

tone_instructions: |
  Findings must include a concrete failure scenario: specific inputs / state
  that lead to the wrong output, crash, or data corruption. Rank real
  correctness / persistence / concurrency bugs above style nits. Skip
  cosmetic suggestions on doc comments unless the comment misdescribes
  actual behaviour. Reply in Japanese to match the project's review
  history; keep each finding under ~10 lines.

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true

  path_filters:
    # Generated dictionary (~343k lines auto-generated from IPADIC).
    - "!src/core/dictionary/builtin_dict.rs"
    # Fcitx5 CMake build artifacts.
    - "!fcitx5/build/**"
    # Rust build artifacts.
    - "!target/**"
    # Bug lists, review notes, session scratchpads.
    - "!work/**"
    # AI collaboration context / methodology docs.
    - "!.ai-context/**"
    # Static XML descriptor / assets.
    - "!data/**"
    # Compiled release archives.
    - "!*.tar.gz"

  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Production Rust must NOT use unwrap() — always use Result<T, E>
        or explicit fallbacks. unwrap()/expect() are allowed only under
        #[cfg(test)] and in test modules. Poison-recovery via
        `.unwrap_or_else(|e| e.into_inner())` on Mutex/RwLock is idiomatic
        and NOT a violation. Watch specifically for: (a) missing
        `initial_from_learned` propagation in ConversionState
        constructors — every `ConversionState { ... }` must fill it in;
        (b) any new async / thread spawn that could stall the IBus or
        Fcitx5 main loop synchronously (the LLM tiebreak deadline
        pattern is the reference — always wall-clock-bound); (c) SQLite
        writes that don't wrap in a single transaction when they need
        to hold an invariant across statements. Do not flag comment
        length or missing doc comments as issues.

    - path: "fcitx5/**/*.{cpp,h}"
      instructions: |
        The Fcitx5 addon runs dictionary-management dialogs on detached
        threads and shells out to zenity via posix_spawn + pipe (no
        shell). New process spawns MUST use pipe2(O_CLOEXEC) so parallel
        dialogs don't inherit sibling pipe fds. Do NOT re-introduce
        popen("sh -c …") or system() with user-controlled strings —
        the shellQuote helper was removed on purpose. All user-entry
        text arrives from external processes (zenity / the GTK dialog)
        and must be treated as untrusted for shell / argv purposes.

    - path: "src/ibus/**/*.rs"
      instructions: |
        IPC with the word-register GTK dialog uses the `reading|surface`
        line format, split on the FIRST '|'. Any parse change must
        continue to reject '|' inside reading (the surface may
        legitimately contain '|'). If the format ever needs a
        third field, migrate to tab or null separator — never add a
        second '|'.

    - path: "scripts/install.sh"
      instructions: |
        The installer internally escalates for /usr/bin writes. Callers
        (including humans in READMEs) MUST NOT prefix `sudo`. Do not
        add `sudo` to invocations elsewhere in the repo or in review
        suggestions.

    - path: "Cargo.toml"
      instructions: |
        Version bumps here MUST accompany five other files in the same
        commit: README.md (badge), data/bonolith.xml, fcitx5/bonolith-addon.conf,
        fcitx5/CMakeLists.txt, CLAUDE.md (the `**Version**` line). Cargo.lock
        must also be committed (regenerated by `cargo build --release`).
        Flag any partial version bump as a bug — v3.1.2 shipped without
        Cargo.lock and required a force-push to recover.

    - path: "tests/**/*.rs"
      instructions: |
        Test code may use unwrap()/expect() freely. The hermetic
        conversion suite (tests/conversion_quality.rs) is the CI gate
        for Top-1 accuracy — any change that materially changes
        segmentation behaviour must be evaluated here.

    - path: "**/*.md"
      instructions: |
        CLAUDE.md is authoritative for project rules — flag any doc
        change that contradicts it. README.md badges and version lines
        are part of the release-bump sextet (see Cargo.toml rules).
        Skip prose-level style nits.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
      - "wip"
      - "WIP"
      - "[skip review]"
    base_branches:
      - "main"
      - "dev"

chat:
  auto_reply: true
